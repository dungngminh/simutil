name: Setup Dart
description: Setup Flutter (with its Dart SDK), install workspace dependencies, and optionally run codegen

inputs:
  flutter-version:
    description: Flutter version; the workspace includes the Flutter desktop app, so pub needs the Flutter SDK. Empty = latest stable.
    required: false
    default: ''
  run-codegen:
    description: Whether to regenerate changelog and version data
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Install dependencies
      shell: bash
      run: dart pub get

    - name: Generate changelog data
      if: inputs.run-codegen == 'true'
      shell: bash
      run: dart run packages/simutil/tool/generate_changelog.dart

    - name: Generate version data
      if: inputs.run-codegen == 'true'
      shell: bash
      run: dart run packages/simutil/tool/generate_version.dart
