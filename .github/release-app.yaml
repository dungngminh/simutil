# Release-note categories for desktop app releases (app-v* tags). See
# release.yaml for the CLI and how the `cli` / `app` labels split PRs.
changelog:
  exclude:
    labels:
      - ignore-for-release
      - cli
  categories:
    - title: Features ✨
      labels:
        - feature
    - title: Enhancements 🔥
      labels:
        - enhancement
    - title: Fixes 🔧
      labels:
        - fixbug
    - title: Docs 📖
      labels:
        - docs
    - title: CI/CD ⚙️
      labels:
        - ci/cd
    - title: Performance Improvements 📊
      labels:
        - performance
    - title: Other Changes
      labels:
        - "*"
