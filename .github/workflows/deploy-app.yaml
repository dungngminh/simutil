name: Deploy Desktop App

# Fires when a desktop app release (tag app-vX.Y.Z) is published.
on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  homebrew-cask:
    name: Update Homebrew cask
    if: startsWith(github.ref_name, 'app-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: dungngminh/homebrew-simutil
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Render cask
        run: |
          VERSION=${GITHUB_REF_NAME#app-v}
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/SimUtil-macos.dmg" -o SimUtil.dmg
          SHA=$(sha256sum SimUtil.dmg | cut -d ' ' -f 1)
          mkdir -p homebrew-tap/Casks
          sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{SHA256}}/$SHA/g" \
            .github/homebrew/simutil-desktop.rb.template > homebrew-tap/Casks/simutil-desktop.rb

      - name: Commit and push cask
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/simutil-desktop.rb
          git diff --staged --quiet || git commit -m "Update simutil-desktop to ${GITHUB_REF_NAME#app-v}"
          git push

  winget:
    name: Submit to WinGet
    # winget-releaser only updates packages already in winget-pkgs; set the
    # repo variable once the first version was submitted by hand.
    if: startsWith(github.ref_name, 'app-v') && vars.WINGET_APP_PUBLISHED == 'true'
    runs-on: windows-latest
    steps:
      - id: v
        shell: pwsh
        run: echo "version=$($env:GITHUB_REF_NAME -replace '^app-v', '')" >> $env:GITHUB_OUTPUT

      - uses: vedantmgoyal9/winget-releaser@f29ed1ffd34f91223a2aebaa71beaab0901ff9fd # v2
        with:
          identifier: me.dungngminh.simutil
          version: ${{ steps.v.outputs.version }}
          release-tag: ${{ github.ref_name }}
          installers-regex: 'SimUtil-windows-x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
