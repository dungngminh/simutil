name: Deploy to pub.dev

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-dart

      - name: Publish workspace packages
        run: |
          dart pub publish --directory packages/simutil_core --force
          dart pub publish --directory packages/simutil_adb --force
          dart pub publish --directory packages/simutil_apple --force
          dart pub publish --directory packages/simutil_plugins --force
          dart pub publish --directory packages/simutil_cli --force
          dart pub publish --force
