name: Deploy to pub.dev

on:
  push:
    tags:
      - 'cli-v*'       # CLI release: packages/simutil only
      - 'simutil_*-v*' # library release, e.g. simutil_core-v1.0.1
  workflow_dispatch:

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-dart

      # subosito/flutter-action does not set up pub.dev OIDC like
      # dart-lang/setup-dart does; without it `dart pub publish` waits for OAuth.
      - name: Authenticate with pub.dev (OIDC)
        shell: bash
        run: |
          token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://pub.dev" | jq -r .value)"
          echo "::add-mask::$token"
          echo "PUB_TOKEN=$token" >> "$GITHUB_ENV"
          dart pub token add https://pub.dev --env-var PUB_TOKEN

      - name: Publish package for this tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            cli-v*)        dir="packages/simutil"; version="${tag#cli-v}" ;;
            simutil_*-v*)  dir="packages/${tag%-v*}"; version="${tag##*-v}" ;;
            *) echo "::error::Run from a tag (cli-v* or simutil_<pkg>-v*), got '$tag'"; exit 1 ;;
          esac
          if [[ ! -f "$dir/pubspec.yaml" ]]; then
            echo "::error::No package at $dir for tag $tag"; exit 1
          fi
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' "$dir/pubspec.yaml")"
          if [[ "$pubspec_version" != "$version" ]]; then
            echo "::error::Tag $tag does not match $dir/pubspec.yaml version $pubspec_version"; exit 1
          fi
          dart pub publish --directory "$dir" --force
