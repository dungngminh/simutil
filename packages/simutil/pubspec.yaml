version: 1.0.1
homepage: https://github.com/dungngminh/simutil
repository: https://github.com/dungngminh/simutil/tree/main/packages/simutil
issue_tracker: https://github.com/dungngminh/simutil/issues

environment:
  sdk: ^3.11.0

resolution: workspace

dependencies:
