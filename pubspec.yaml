name: simutil
description: TUI application for launching Android Simulators / iOS Simulators and more ...
version: 1.0.0
repository: https://github.com/dungngminh/simutil

environment:
  sdk: ^3.11.0

workspace:
  - packages/simutil_core
  - packages/simutil_adb
  - packages/simutil_apple
  - packages/simutil_plugins
  - packages/simutil_cli

dependencies:
  multicast_dns: ^0.3.3
  nocterm: ^0.8.0
  path: ^1.9.0
  process_run: ^1.3.0
  ascii_qr: ^1.0.1
  yaml: ^3.1.3
  simutil_adb: ^1.0.0
  simutil_apple: ^1.0.0
  simutil_cli: ^1.0.0
  simutil_core: ^1.0.0
  simutil_plugins: ^1.0.0

dev_dependencies:
  build_runner: ^2.12.2
  build_version: ^2.1.3
  lints: ^6.0.0
  melos: ^8.3.0
  mocktail: ^1.0.4
  test: ^1.25.6

executables:
  simutil: simutil

melos:
  repository: https://github.com/dungngminh/simutil
  useRootAsPackage: true
  categories:
    app:
      - "."
    packages:
      - "packages/**"
  command:
    version:
      mode: fixed
  scripts:
    analyze:
      description: Run dart analyze --fatal-infos in every package
      exec:
        command: dart analyze --fatal-infos
      packageFilters:
        dirExists: lib

    test:
      description: Run dart test in every package with tests
      exec:
        command: dart test
      packageFilters:
        dirExists: test

    codegen:
      description: Regenerate changelog data and lib/utils/version.dart
      run: dart run tool/generate_changelog.dart && dart run build_runner build --delete-conflicting-outputs

    compile:
      description: Compile the simutil executable to ./simutil
      run: dart compile exe bin/simutil.dart -o simutil

    tui:
      description: Run the TUI locally; pass CLI args after -- (e.g. melos run tui -- list)
      run: dart run bin/simutil.dart
      stdio: inherit

    check:
      description: Analyze and test the whole workspace (CI parity)
      run: dart run melos run analyze --no-select && dart run melos run test --no-select
