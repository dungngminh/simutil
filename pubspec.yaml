name: simutil_workspace
description: Pub workspace and Melos scripts for the SimUtil monorepo.
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/simutil_core
  - packages/simutil_adb
  - packages/simutil_apple
  - packages/simutil_plugins
  - packages/simutil_shared
  - packages/simutil
  - packages/simutil_h264
  - app

dev_dependencies:
  melos: ^8.3.0

melos:
  repository: https://github.com/dungngminh/simutil
  categories:
    app:
      - "packages/simutil"
    packages:
      - "packages/**"
  # No `command.version.mode: fixed`: packages version independently, so an app
  # release can bump only `simutil`.
  scripts:
    analyze:
      description: Run dart analyze --fatal-infos in every package
      exec:
        command: dart analyze --fatal-infos
      packageFilters:
        dirExists: lib

    test:
      description: Run dart test in every Dart package with tests
      exec:
        command: dart test
      packageFilters:
        dirExists: test
        flutter: false

    test:flutter:
      description: Run flutter test in the desktop app and Flutter packages
      exec:
        command: flutter test
      packageFilters:
        dirExists: test
        flutter: true

    codegen:
      description: Regenerate simutil's version.dart and simutil_shared's changelog_entries.dart
      run: >-
        dart run packages/simutil/tool/generate_changelog.dart &&
        dart run packages/simutil/tool/generate_version.dart &&
        dart format packages/simutil/lib/src/version.dart packages/simutil_shared/lib/src/changelog_entries.dart

    compile:
      description: Compile the simutil executable to ./simutil
      run: dart compile exe packages/simutil/bin/simutil.dart -o simutil

    cli:
      description: Run the TUI locally; pass CLI args after -- (e.g. melos run tui -- list)
      run: dart run packages/simutil/bin/simutil.dart
      stdio: inherit

    cli_hot_reload:
      description: Run the CLI with hot reload
      run: dart --enable-vm-service packages/simutil/bin/simutil.dart
      stdio: inherit

    check:
      description: Analyze and test the whole workspace (CI parity)
      run: dart run melos run analyze --no-select && dart run melos run test --no-select && dart run melos run test:flutter --no-select
